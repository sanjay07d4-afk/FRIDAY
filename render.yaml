services:
  - type: web
    name: friday-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        value: friday-dev-secret-key
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./friday.db"
